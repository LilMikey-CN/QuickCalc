<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5ef" />
    <meta name="description" content="Card 结算、现金核对和澳元点钞，精确计算并自动保存。" />
    <title>结算工具 · NO.3</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="calculator">
      <header class="page-header">
        <div>
          <p class="eyebrow"><span class="brand-mark" aria-hidden="true"></span> NO.3 <span class="eyebrow-divider">/</span> DAILY TOOLS</p>
          <h1><span id="page-title">Card 结算</span><span class="title-dot">.</span></h1>
          <p class="subtitle" id="page-subtitle">输入金额，即时计算</p>
        </div>
        <button class="reset-button" type="reset" form="calculator-form" id="reset-button" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1.8 7.1M4 4v6h6" stroke-linecap="round" stroke-linejoin="round" /></svg>
          清空
        </button>
      </header>

      <div class="tabs" role="tablist" aria-label="计算工具">
        <button class="tab" id="tab-card" type="button" role="tab" aria-selected="true" aria-controls="panel-card" data-tab="card">Card</button>
        <button class="tab" id="tab-notes" type="button" role="tab" aria-selected="false" aria-controls="panel-notes" data-tab="notes" tabindex="-1">点钞</button>
        <button class="tab" id="tab-cash" type="button" role="tab" aria-selected="false" aria-controls="panel-cash" data-tab="cash" tabindex="-1">现金</button>
      </div>

      <section id="panel-card" role="tabpanel" aria-labelledby="tab-card"></section>
      <section id="panel-cash" role="tabpanel" aria-labelledby="tab-cash" hidden></section>
      <section id="panel-notes" role="tabpanel" aria-labelledby="tab-notes" hidden></section>
      <noscript><p class="noscript-message">请开启浏览器的 JavaScript 以使用计算器。</p></noscript>
    </main>

    <template id="calculator-template">
      <form class="calculator-form" novalidate autocomplete="off">
        <div class="section-heading">
          <h2 class="input-heading">输入金额</h2>
          <p class="input-hint">0–20,000 · 最多 2 位小数</p>
        </div>
        <div class="fields"></div>
      </form>

      <section class="result-card">
        <div class="result-heading">
          <h2 class="result-title">计算结果</h2>
          <span class="live-badge"><span aria-hidden="true"></span>实时计算</span>
        </div>
        <output class="result-value" aria-live="polite" aria-atomic="true">0.00</output>
        <div class="result-details">
          <div class="cash-summary" hidden>
            <p><span>应有现金</span><span class="expected-value">0.00</span></p>
            <p><span>当前钱箱余额</span><span class="drawer-value">0.00</span></p>
          </div>
          <p class="formula-label"></p>
          <p class="formula-values"></p>
          <p class="balance-status" hidden></p>
        </div>
      </section>

      <section class="subtotal-card" hidden>
        <div class="result-heading">
          <h2 class="subtotal-title">小面额合计</h2>
          <span class="subtotal-denominations">$20 / $10 / $5</span>
        </div>
        <output class="subtotal-value" aria-live="polite" aria-atomic="true">0.00</output>
        <p class="subtotal-formula"></p>
      </section>

      <footer class="page-footer">
        <p><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 8 2.5 2.5L12 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></svg><span class="precision-hint">精确到分</span><span>·</span>空白按 0 计算</p>
        <button class="copy-button" type="button">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="7" y="7" width="9" height="10" rx="2" /><path d="M12 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2" /></svg>
          <span class="copy-label">复制结果</span>
        </button>
      </footer>
      <p class="storage-status" role="status"></p>
      <p class="action-status" role="status"></p>
    </template>

    <template id="field-template">
      <div class="field">
        <span class="operator" aria-hidden="true">+</span>
        <div class="field-content">
          <label></label>
          <input type="text" inputmode="decimal" enterkeyhint="next" placeholder="0.00" spellcheck="false" autocapitalize="off" />
          <p class="field-error" hidden></p>
        </div>
        <span class="field-index" aria-hidden="true"></span>
      </div>
    </template>
  </body>
</html>
